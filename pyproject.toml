[project]
name = "offcatalog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ivo Pletikosic", email = "ivo@pletikosic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "rapidfuzz>=3.14.5",
    "typer>=0.27.1",
]

[project.scripts]
offcatalog = "offcatalog.cli:app"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
