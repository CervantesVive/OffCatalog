[project]
name = "offcatalog"
version = "0.1.0"
description = "Local-first CLI that scans an MP3 collection and flags tracks not available on streaming (Deezer + MusicBrainz)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ivo Pletikosic", email = "ivo@pletikosic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mutagen>=1.48.1",
    "rapidfuzz>=3.14.5",
    "typer>=0.27.1",
]

[project.scripts]
offcatalog = "offcatalog.cli:app"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "manual: requires live network access to a real provider, skipped by default",
]
# Manual tests hit a real provider over the network — deselected by default so the
# normal suite stays offline and deterministic. Run them with: uv run pytest -m manual
addopts = "-m 'not manual'"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
